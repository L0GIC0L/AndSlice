name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.3.13750724
  CMAKE_VERSION: 3.31.6

jobs:
  native:
    name: Native library (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      CCACHE: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1500M
    steps:
      - uses: actions/checkout@v4

      # The finished library only depends on the native sources and build scripts;
      # app-only changes reuse it and skip the long C++ build.
      - name: Restore native library
        id: lib-cache
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/jniLibs/${{ matrix.abi }}/libandslice.so
          key: lib-${{ matrix.abi }}-${{ hashFiles('native/**', 'scripts/**', 'patches/**') }}

      - name: Install NDK, CMake and ccache
        if: steps.lib-cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null
          sudo apt-get update -q && sudo apt-get install -y -q ccache

      - name: Fetch PrusaSlicer sources
        if: steps.lib-cache.outputs.cache-hit != 'true'
        run: scripts/fetch-prusaslicer.sh

      # Restore and save are separate steps so the dependencies are kept even
      # when a later step fails.
      - name: Restore dependencies
        if: steps.lib-cache.outputs.cache-hit != 'true'
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: build/deps/${{ matrix.abi }}/install
          key: deps-${{ matrix.abi }}-${{ hashFiles('scripts/build-deps.sh', 'scripts/env.sh') }}

      - name: Build dependencies
        if: steps.lib-cache.outputs.cache-hit != 'true' && steps.deps-cache.outputs.cache-hit != 'true'
        run: scripts/build-deps.sh ${{ matrix.abi }}

      - name: Save dependencies
        if: steps.lib-cache.outputs.cache-hit != 'true' && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/deps/${{ matrix.abi }}/install
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Restore compiler cache
        if: steps.lib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.abi }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.abi }}-

      - name: Build libandslice.so
        if: steps.lib-cache.outputs.cache-hit != 'true'
        run: |
          scripts/build-native.sh ${{ matrix.abi }}
          ccache --show-stats

      - name: Save compiler cache
        if: always() && steps.lib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.abi }}-${{ github.sha }}

      - name: Save native library
        if: steps.lib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/jniLibs/${{ matrix.abi }}/libandslice.so
          key: ${{ steps.lib-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: libandslice-${{ matrix.abi }}
          path: app/src/main/jniLibs/${{ matrix.abi }}/libandslice.so
          retention-days: 7

  apk:
    name: APK
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Optional release signing key (base64 of a .jks); without it the debug key signs the APKs.
      ANDSLICE_KEYSTORE_BASE64: ${{ secrets.ANDSLICE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK (used to strip the native libraries)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - uses: actions/download-artifact@v4
        with:
          name: libandslice-arm64-v8a
          path: app/src/main/jniLibs/arm64-v8a
      - uses: actions/download-artifact@v4
        with:
          name: libandslice-x86_64
          path: app/src/main/jniLibs/x86_64

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up release signing
        if: env.ANDSLICE_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDSLICE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDSLICE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APKs
        env:
          ANDSLICE_KEYSTORE_PASSWORD: ${{ secrets.ANDSLICE_KEYSTORE_PASSWORD }}
          ANDSLICE_KEY_ALIAS: ${{ secrets.ANDSLICE_KEY_ALIAS }}
          ANDSLICE_KEY_PASSWORD: ${{ secrets.ANDSLICE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APKs
        run: |
          mkdir -p dist
          version="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          for apk in app/build/outputs/apk/release/*.apk; do
            abi="$(basename "$apk" .apk | sed -e 's/^app-//' -e 's/-release$//')"
            cp "$apk" "dist/AndSlice-$version-$abi.apk"
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: AndSlice-apks
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk

  device-test:
    name: Emulator test (x86_64)
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/download-artifact@v4
        with:
          name: libandslice-x86_64
          path: app/src/main/jniLibs/x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: app/build/reports/androidTests
          retention-days: 7
