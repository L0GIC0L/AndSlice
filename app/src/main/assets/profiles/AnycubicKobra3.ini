# PrusaSlicer configuration bundle for the Anycubic Kobra 3.
#
# Machine limits, start/end G-code, speeds, accelerations and material
# temperatures follow Anycubic's Kobra 3 profiles as published in OrcaSlicer
# (resources/profiles/Anycubic, AGPL-3.0), translated to PrusaSlicer 2.9 keys.

[vendor]
name = Anycubic Kobra 3 (AndSlice)
config_version = 1.0.0
config_update_url =

[printer_model:KOBRA3]
name = Anycubic Kobra 3
variants = 0.4; 0.2; 0.6; 0.8
technology = FFF
family = KOBRA
default_materials = Anycubic PLA @Kobra 3; Anycubic PLA High Speed @Kobra 3; Anycubic PETG @Kobra 3; Generic ABS @Kobra 3; Generic TPU @Kobra 3

# The Kobra 3 Combo: the same printer with the ACE Pro, which feeds four
# filaments into the single nozzle.
[printer_model:KOBRA3COMBO]
name = Anycubic Kobra 3 Combo (ACE Pro)
variants = 0.4; 0.2; 0.6; 0.8
technology = FFF
family = KOBRA
default_materials = Anycubic PLA @Kobra 3; Anycubic PLA High Speed @Kobra 3; Anycubic PETG @Kobra 3; Generic ABS @Kobra 3; Generic TPU @Kobra 3

# Presets whose names start with an asterisk are internal templates and are
# not shown in the app. NO_TEMPLATES keeps PrusaSlicer's generic template
# filaments away from the Kobra 3: their ramming settings do not suit the ACE.

########################################################################
# Printers
########################################################################

[printer:*common*]
printer_technology = FFF
printer_vendor =
printer_model = KOBRA3
printer_notes = Do not remove the keywords below.\nPRINTER_VENDOR_ANYCUBIC\nPRINTER_MODEL_KOBRA3\nNO_TEMPLATES
bed_shape = 0x0,255x0,255x255,0x255
max_print_height = 260
z_offset = 0
gcode_flavor = klipper
use_relative_e_distances = 1
use_firmware_retraction = 0
use_volumetric_e = 0
variable_layer_height = 1
