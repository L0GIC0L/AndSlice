max_layer_height = 0.56
retract_length = 1
default_print_profile = 0.40mm Standard @Kobra 3 0.8 nozzle

# With the ACE Pro, every filament change is a plain T<n>. The firmware cuts
# the filament, swaps it and purges into the chute behind the bed, as with
# Anycubic Slicer Next. T0-T3 are ACE slots 1-4 (Rinkhals maps them the same
# way). The prime tower only takes the small purge that follows.
[printer:*combo*]
printer_model = KOBRA3COMBO
printer_notes = Do not remove the keywords below.\nPRINTER_VENDOR_ANYCUBIC\nPRINTER_MODEL_KOBRA3\nPRINTER_HAS_ACE\nNO_TEMPLATES
single_extruder_multi_material = 1
extruder_colour = "";"";"";""
cooling_tube_length = 0
cooling_tube_retraction = 0
parking_pos_retraction = 0
extra_loading_move = 0
high_current_on_filament_swap = 0
multimaterial_purging = 45
toolchange_gcode =

[printer:Anycubic Kobra 3 Combo 0.4 nozzle]
inherits = Anycubic Kobra 3 0.4 nozzle; *combo*
nozzle_diameter = 0.4,0.4,0.4,0.4

[printer:Anycubic Kobra 3 Combo 0.2 nozzle]
inherits = Anycubic Kobra 3 0.2 nozzle; *combo*
nozzle_diameter = 0.2,0.2,0.2,0.2

[printer:Anycubic Kobra 3 Combo 0.6 nozzle]
inherits = Anycubic Kobra 3 0.6 nozzle; *combo*
nozzle_diameter = 0.6,0.6,0.6,0.6

[printer:Anycubic Kobra 3 Combo 0.8 nozzle]
inherits = Anycubic Kobra 3 0.8 nozzle; *combo*
nozzle_diameter = 0.8,0.8,0.8,0.8

