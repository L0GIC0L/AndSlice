max_layer_height = 0.28
extruder_colour = ""
extruder_offset = 0x0
extruder_clearance_height = 30
extruder_clearance_radius = 45
single_extruder_multi_material = 0
retract_length = 1
retract_speed = 60
deretract_speed = 60
retract_restart_extra = 0
retract_before_travel = 1
retract_before_wipe = 0%
retract_layer_change = 1
retract_lift = 0.4
retract_lift_above = 0.3
retract_lift_below = 259.6
retract_length_toolchange = 0
retract_restart_extra_toolchange = 0
travel_lift_before_obstacle = 0
travel_ramping_lift = 0
travel_max_lift = 0.4
travel_slope = 0
wipe = 1
# G9111 is Anycubic's start macro: it heats the bed and nozzle, levels the bed
# and draws the purge line. The M190/M109 that follow return at once when the
# macro already reached the print temperatures.
start_gcode = G9111 bedTemp=[first_layer_bed_temperature] extruderTemp=[first_layer_temperature[initial_tool]]\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature[initial_tool]]\nM117\nM900 K0.051
end_gcode = M400\nG92 E0 ; zero the extruder\nG1 E-2 F3600\n{if max_layer_z < max_print_height-1}G1 Z{max_layer_z+2} F900 ; move print head further up{endif}\nG1 X250 Y220 F12000 ; present print\nM140 S0 ; turn off heatbed\nM104 S0 ; turn off hotend\nM107 ; turn off fan\nM84 ; disable stepper motors
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n;[layer_z]
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
toolchange_gcode =
between_objects_gcode =
color_change_gcode = M600
pause_print_gcode = M601
template_custom_gcode =
default_print_profile = 0.20mm Standard @Kobra 3 0.4 nozzle
default_filament_profile = Anycubic PLA @Kobra 3

