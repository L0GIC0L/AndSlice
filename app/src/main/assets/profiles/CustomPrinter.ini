# Base profiles for printers without a vendor profile. Custom printers made in
# the app are user presets that inherit "Custom printer" with their own bed,
# nozzle, firmware and G-code. Filaments come from PrusaSlicer's Templates.

[vendor]
name = Custom printers (AndSlice)
config_version = 1.0.0
config_update_url =

[printer_model:CUSTOM]
name = Custom printer
variants = 0.4
technology = FFF
family = CUSTOM

[printer:Custom printer]
printer_technology = FFF
printer_model = CUSTOM
printer_variant = 0.4
printer_notes = PRINTER_CUSTOM
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
z_offset = 0
nozzle_diameter = 0.4
min_layer_height = 0.07
max_layer_height = 0.3
gcode_flavor = marlin2
use_relative_e_distances = 1
use_firmware_retraction = 0
use_volumetric_e = 0
variable_layer_height = 1
binary_gcode = 0
remaining_times = 1
machine_limits_usage = time_estimate_only
thumbnails =
extruder_colour = ""
retract_length = 1
retract_speed = 35
deretract_speed = 0
retract_before_travel = 1.5
retract_layer_change = 1
retract_lift = 0.2
retract_lift_above = 0
retract_lift_below = 0
wipe = 0
# Heats, homes and draws a purge line along the left edge of the bed.
start_gcode = G90 ; absolute coordinates\nM83 ; relative extrusion\nM140 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature]\nG28 ; home all axes\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG92 E0\nG1 Z2 F3000\nG1 X3 Y20 F5000\nG1 Z0.3 F3000\nG1 Y{min(print_bed_max[1] - 20, 200)} E15 F1500 ; purge line\nG1 X3.4 F5000\nG1 Y20 E15 F1500\nG92 E0\nG1 Z2 F3000
end_gcode = M104 S0 ; hotend off\nM140 S0 ; bed off\nM107 ; fan off\nG91\nG1 Z5 F600 ; lift\nG90\n{if max_layer_z < max_print_height - 10}G1 Z{max_layer_z + 10} F600{endif}\nG1 X0 Y{print_bed_max[1]} F3000 ; present the print\nM84 ; motors off
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n;[layer_z]
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
toolchange_gcode =
color_change_gcode = M600
pause_print_gcode = M601
default_print_profile = 0.20mm Standard @Custom
default_filament_profile = Generic PLA @Template

[print:*common*]
compatible_printers =
compatible_printers_condition = printer_model=="CUSTOM"
perimeters = 2
top_solid_layers = 5
bottom_solid_layers = 4
top_solid_min_thickness = 0.7
bottom_solid_min_thickness = 0.5
fill_density = 15%
fill_pattern = grid
top_fill_pattern = monotoniclines
bottom_fill_pattern = monotonic
first_layer_height = 0.2
perimeter_speed = 50
small_perimeter_speed = 30
external_perimeter_speed = 35
infill_speed = 80
solid_infill_speed = 60
top_solid_infill_speed = 40
support_material_speed = 50
support_material_interface_speed = 100%
bridge_speed = 30
gap_fill_speed = 30
travel_speed = 150
first_layer_speed = 20
default_acceleration = 0
skirts = 1
skirt_distance = 3
skirt_height = 1
brim_width = 0
support_material = 0
support_material_contact_distance = 0.2
seam_position = aligned
thin_walls = 0
gcode_label_objects = firmware
output_filename_format = [input_filename_base]_[layer_height]mm_[filament_type]_[print_time].gcode

[print:0.12mm Fine @Custom]
inherits = *common*
layer_height = 0.12

[print:0.20mm Standard @Custom]
inherits = *common*
layer_height = 0.2

[print:0.28mm Draft @Custom]
inherits = *common*
layer_height = 0.28
perimeter_speed = 60
infill_speed = 90
